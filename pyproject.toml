[project]
name = "survaas-python-tools"
version = "0.1.0"
requires-python = ">=3.9"

[dependency-groups]
dev = [
	"pre-commit>=4.0.0,<5.0.0",
	"ruff>=0.16.7",
]

[tool.uv]
package = false

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["docs", "cdk.out", "dist", "node_modules", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
